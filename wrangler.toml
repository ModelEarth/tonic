name = "transcript-intake"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Secrets (WEBHOOK_SECRET, ARCHIVIST_TOKEN) are NOT set here. They're
# pushed at deploy time via `wrangler secret put`, driven by GitHub Actions
# secrets — see .github/workflows/deploy-transcript-intake.yml and README.md.

[vars]
# This deploy will not work until ARCHIVIST_TOKEN (a GitHub secret on
# *this* repo, set separately from wrangler.toml) is scoped to
# Earthscape/archivist1 - see README.md's Setup section. That's a manual
# step for whoever owns this repo's deploy; nothing here can automate it.
ARCHIVIST_REPO = "Earthscape/archivist1"
